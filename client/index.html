    <link rel="icon" id="favicon" href="" />

    <script>
      const ICON_LIGHT = "/favicon-light.png";
      const ICON_DARK = "/favicon-dark.png";

      function updateFavicon() {
        const stored = localStorage.getItem("knapsnack_theme");
        const isDark = stored
          ? stored === "dark"
          : globalThis.matchMedia("(prefers-color-scheme: dark)").matches;
        document.getElementById("favicon").href = isDark
          ? ICON_DARK
          : ICON_LIGHT;
      }

      updateFavicon();
      globalThis.addEventListener("knapsnack-theme-change", updateFavicon);
    </script>

    <title>Knap[Snack]: The Cost-Optimised Meal Planner</title>
